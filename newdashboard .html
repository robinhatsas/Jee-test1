<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Workspace & File Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- TOP BAR: Quick Links Hub -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex flex-col md:flex-row justify-between items-center gap-4 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-xl">
                <i class="fa-solid fa-graduation-cap text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-gray-900 text-lg">JEE Study Workspace</h1>
                <p class="text-xs text-gray-500">Task Manager • File Vault • Live Clock</p>
            </div>
        </div>

        <!-- Quick Links -->
        <div class="flex items-center gap-2 overflow-x-auto max-w-full pb-1 md:pb-0">
            <a href="https://web.getmarks.app" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition border border-gray-200 font-medium">
                <i class="fa-solid fa-pen-to-square text-emerald-600"></i> Marks App
            </a>
            <a href="https://free-mocks.quizrr.in" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition border border-gray-200 font-medium">
                <i class="fa-solid fa-bullseye text-amber-600"></i> Quizrr
            </a>
            <a href="https://jeemain.nta.nic.in" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition border border-gray-200 font-medium">
                <i class="fa-solid fa-university text-blue-600"></i> NTA
            </a>
        </div>
    </header>

    <!-- MAIN APP CONTENT -->
    <div class="flex flex-1 flex-col md:flex-row overflow-hidden">
        
        <!-- SIDEBAR NAVIGATION -->
        <aside class="w-full md:w-64 bg-white border-r border-gray-200 p-4 flex flex-col justify-between shadow-sm">
            <div>
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-2">Navigation</h2>
                <nav class="space-y-1">
                    <button onclick="switchView('tasks')" id="nav-tasks" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-semibold bg-blue-50 text-blue-600 border border-blue-100 transition">
                        <i class="fa-solid fa-list-check"></i> Task Manager
                    </button>
                    <button onclick="switchView('clock')" id="nav-clock" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium text-gray-600 hover:bg-gray-100 transition">
                        <i class="fa-regular fa-clock"></i> Real-Time Clock
                    </button>
                    <button onclick="switchView('files')" id="nav-files" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium text-gray-600 hover:bg-gray-100 transition">
                        <i class="fa-solid fa-folder-open"></i> PDF & File Vault
                    </button>
                </nav>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100 text-xs text-gray-400 text-center">
                Tablet Workspace
            </div>
        </aside>

        <!-- MAIN DISPLAY CANVAS -->
        <main class="flex-1 p-6 overflow-y-auto bg-gray-50 flex flex-col">
            
            <!-- VIEW 1: TASK MANAGER (White Background) -->
            <section id="view-tasks" class="flex-1 flex flex-col gap-6">
                <!-- Task Folder Selector -->
                <div class="flex flex-wrap gap-2 border-b border-gray-200 pb-4">
                    <button onclick="switchTaskCategory('Physics')" id="cat-Physics" class="px-4 py-2 rounded-lg font-medium text-sm bg-gray-900 text-white shadow-sm">Physics</button>
                    <button onclick="switchTaskCategory('Chemistry')" id="cat-Chemistry" class="px-4 py-2 rounded-lg font-medium text-sm bg-white text-gray-600 hover:bg-gray-100 border border-gray-200">Chemistry</button>
                    <button onclick="switchTaskCategory('Maths')" id="cat-Maths" class="px-4 py-2 rounded-lg font-medium text-sm bg-white text-gray-600 hover:bg-gray-100 border border-gray-200">Maths</button>
                    <button onclick="switchTaskCategory('General')" id="cat-General" class="px-4 py-2 rounded-lg font-medium text-sm bg-white text-gray-600 hover:bg-gray-100 border border-gray-200">General Goals</button>
                </div>

                <!-- Input & White Card Container -->
                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm flex-1 flex flex-col gap-6">
                    <form onsubmit="addTask(event)" class="flex gap-2">
                        <input type="text" id="task-input" placeholder="Add a new study task or PYQ goal..." required
                               class="flex-1 bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center gap-2 shadow-sm">
                            <i class="fa-solid fa-plus"></i> Add
                        </button>
                    </form>

                    <ul id="task-list" class="space-y-3 flex-1">
                        <!-- Tasks dynamically render here -->
                    </ul>
                </div>
            </section>

            <!-- VIEW 2: REAL-TIME CLOCK -->
            <section id="view-clock" class="hidden flex-1 flex flex-col items-center justify-center">
                <div class="bg-white border border-gray-200 rounded-3xl p-10 text-center shadow-sm max-w-lg w-full flex flex-col gap-4">
                    <div class="inline-flex p-4 bg-blue-50 text-blue-600 rounded-full w-fit mx-auto">
                        <i class="fa-regular fa-clock text-4xl"></i>
                    </div>
                    <div>
                        <div id="big-live-clock" class="text-5xl md:text-6xl font-bold font-mono text-gray-900 tracking-wider">00:00:00 AM</div>
                        <div id="big-live-date" class="text-gray-500 font-medium mt-2 text-lg">Loading date...</div>
                    </div>
                </div>
            </section>

            <!-- VIEW 3: FILE UPLOADER (PDF Vault) -->
            <section id="view-files" class="hidden flex-1 flex flex-col gap-6">
                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm flex flex-col gap-4">
                    <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i class="fa-solid fa-file-pdf text-red-500"></i> Upload & Store PYQ PDFs
                    </h2>
                    
                    <!-- File Upload Input Area -->
                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-gray-50 flex flex-col items-center justify-center gap-3">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400"></i>
                        <p class="text-sm font-medium text-gray-600">Select PDFs or notes to keep them handy during study sessions</p>
                        <input type="file" id="file-input" accept=".pdf,image/*" onchange="handleFileUpload(event)" class="hidden">
                        <button onclick="document.getElementById('file-input').click()" class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-sm">
                            Choose File
                        </button>
                    </div>
                </div>

                <!-- Saved Files List -->
                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm flex-1">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Your Stored Files</h3>
                    <ul id="file-list" class="space-y-3">
                        <!-- Uploaded files will list here -->
                    </ul>
                </div>
            </section>

        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Switch Between Navigation Views
        function switchView(viewName) {
            ['tasks', 'clock', 'files'].forEach(v => {
                const section = document.getElementById(`view-${v}`);
                const navBtn = document.getElementById(`nav-${v}`);
                if (v === viewName) {
                    section.classList.remove('hidden');
                    navBtn.className = "w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-semibold bg-blue-50 text-blue-600 border border-blue-100 transition";
                } else {
                    section.classList.add('hidden');
                    navBtn.className = "w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium text-gray-600 hover:bg-gray-100 transition";
                }
            });
        }

        // Real-Time Clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
            
            document.getElementById('big-live-clock').textContent = timeString;
            document.getElementById('big-live-date').textContent = dateString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Tasks Memory Logic
        let currentTaskCat = 'Physics';
        let tasks = JSON.parse(localStorage.getItem('jee_white_tasks')) || {
            Physics: [{ id: 1, text: "Solve Electrostatics PYQs", completed: false }],
            Chemistry: [{ id: 2, text: "Revise Organic Chemistry reactions", completed: true }],
            Maths: [],
            General: []
        };

        function saveTasks() {
            localStorage.setItem('jee_white_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function switchTaskCategory(cat) {
            currentTaskCat = cat;
            ['Physics', 'Chemistry', 'Maths', 'General'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "px-4 py-2 rounded-lg font-medium text-sm bg-gray-900 text-white shadow-sm";
                } else {
                    btn.className = "px-4 py-2 rounded-lg font-medium text-sm bg-white text-gray-600 hover:bg-gray-100 border border-gray-200";
                }
            });
            renderTasks();
        }

        function addTask(e) {
            e.preventDefault();
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (!text) return;

            if (!tasks[currentTaskCat]) tasks[currentTaskCat] = [];
            tasks[currentTaskCat].push({ id: Date.now(), text: text, completed: false });
            input.value = '';
            saveTasks();
        }

        function toggleTask(id) {
            tasks[currentTaskCat] = tasks[currentTaskCat].map(t => {
                if (t.id === id) t.completed = !t.completed;
                return t;
            });
            saveTasks();
        }

        function deleteTask(id) {
            tasks[currentTaskCat] = tasks[currentTaskCat].filter(t => t.id !== id);
            saveTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';

            const currentTasks = tasks[currentTaskCat] || [];

            if (currentTasks.length === 0) {
                listEl.innerHTML = `<li class="text-gray-400 text-center py-8">No tasks in this category yet.</li>`;
                return;
            }

            currentTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between p-3.5 bg-gray-50 rounded-xl border border-gray-200 hover:border-gray-300 transition";
                li.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer flex-1 mr-2" onclick="toggleTask(${task.id})">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} class="w-5 h-5 accent-blue-600 rounded cursor-pointer">
                        <span class="${task.completed ? 'line-through text-gray-400' : 'text-gray-800'} text-base font-medium">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-gray-400 hover:text-red-500 p-2 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                listEl.appendChild(li);
            });
        }

        // File Uploader Handling
        let uploadedFiles = [];

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileObj = {
                id: Date.now(),
                name: file.name,
                size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
                url: URL.createObjectURL(file)
            };

            uploadedFiles.push(fileObj);
            renderFiles();
        }

        function deleteFile(id) {
            uploadedFiles = uploadedFiles.filter(f => f.id !== id);
            renderFiles();
        }

        function renderFiles() {
            const listEl = document.getElementById('file-list');
            listEl.innerHTML = '';

            if (uploadedFiles.length === 0) {
                listEl.innerHTML = `<li class="text-gray-400 text-center py-8">No files uploaded yet. Choose a file above to add it.</li>`;
                return;
            }

            uploadedFiles.forEach(f => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200";
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-file-pdf text-red-500 text-2xl"></i>
                        <div>
                            <div class="font-medium text-gray-800 text-sm">${f.name}</div>
                            <div class="text-xs text-gray-400">${f.size}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="${f.url}" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-700 transition">
                            Open / View
                        </a>
                        <button onclick="deleteFile(${f.id})" class="text-gray-400 hover:text-red-500 p-2 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        // Initial Renders
        renderTasks();
        renderFiles();
    </script>
</body>
</html>
